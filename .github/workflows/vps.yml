name: Deploy to VPS (marketing-studio.pro)

# Каждый пуш в main собирает сайт под корень домена и заливает его на VPS.
# Пока в репозитории нет секретов VPS_HOST / VPS_USER / VPS_SSH_KEY, workflow ничего не делает.
# Сервер настраивается один раз скриптом deploy/setup-server.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.secrets.outputs.enabled }}
    steps:
      - id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: echo "enabled=$([ -n "$VPS_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: vps
      url: https://marketing-studio.pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Сайт живёт в корне домена, поэтому basePath пустой
      - run: npm run build
        env:
          PAGES_BASE_PATH: ""

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            out/ "$VPS_USER@$VPS_HOST:/var/www/marketing-studio/"

      # Код приёмника заявок обновляется вместе с сайтом; служба есть после deploy/setup-leads.sh
      - name: Update lead bot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          if $SSH "$VPS_USER@$VPS_HOST" 'test -d ~/lead-bot'; then
            rsync -az -e "$SSH" deploy/lead-bot.py "$VPS_USER@$VPS_HOST:lead-bot/lead-bot.py"
            $SSH "$VPS_USER@$VPS_HOST" 'sudo -n systemctl restart lead-bot && sleep 1 && systemctl is-active lead-bot'
          else
            echo "lead-bot ещё не установлен, пропускаю"
          fi

      # Скрипт настройки сервера для поиска лежит в домашней папке: его запускают один раз под root
      - name: Upload server scripts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            deploy/setup-seo.sh "$VPS_USER@$VPS_HOST:setup-seo.sh"

      - name: Smoke test
        run: |
          sleep 2
          curl -fsS -o /dev/null -w "https://marketing-studio.pro -> %{http_code}\n" https://marketing-studio.pro/ \
            || curl -fsS -o /dev/null -w "http://${{ secrets.VPS_HOST }} -> %{http_code}\n" "http://${{ secrets.VPS_HOST }}/"
          # Файлы для поисковиков: не роняем деплой, только показываем статус
          for f in robots.txt sitemap.xml; do
            curl -sS -o /dev/null -w "$f -> %{http_code}\n" "https://marketing-studio.pro/$f" || true
          done
